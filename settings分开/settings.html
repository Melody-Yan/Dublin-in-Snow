<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: url('https://resource-17v.pages.dev/auc.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            margin-top: 10vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .music-player {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.3);
        }

        #music-title {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .progress-container {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            margin: 10px 0;
            position: relative;
        }

        #progress-bar {
            height: 100%;
            width: 0;
            background: white;
            position: absolute;
        }

        .controls {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }

        .controls button {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .controls button:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        .music-section {
            margin-top: 20px;
            text-align: center;
        }

        .music-section input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
        }

        .music-section button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.3);
            color: white;
            border: none;
            cursor: pointer;
        }

        .music-list {
            margin-top: 10px;
            list-style-type: none;
            padding: 0;
        }

        .music-list li {
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            background: rgba(255, 255, 255, 0.2);
            margin: 5px 0;
            border-radius: 5px;
        }

        .music-list button {
            background: rgba(255, 0, 0, 0.6);
            border: none;
            color: white;
            padding: 4px 8px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 3px;
        }

        .music-list button:hover {
            background: rgba(255, 0, 0, 0.8);
        }
/* 回到首页按钮样式 */
        #home-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #home-link:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

    </style>
</head>
<body>

<a href="index.html" id="home-link">🏠 回到首页</a>
    <div class="container">
        <h1>设置</h1>

        <!-- 音乐管理 -->
        <div class="music-section">
            <h3>音乐管理</h3>
            <input type="text" id="music-input" placeholder="输入音乐链接">
            <button onclick="saveMusic()">添加</button>
            <ul id="music-list" class="music-list"></ul>
        </div>
<!-- 音乐播放器 -->
<h3>如果对世界失望就戴上耳机</h3>
        <div class="music-player">
            <p id="music-title">无音乐</p>
            <audio id="audio-player"></audio>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div class="controls">
                <button onclick="prevTrack()">⏮</button>
                <button onclick="togglePlayPause()">⏸</button>
                <button onclick="nextTrack()">⏭</button>
            </div>
        </div>
<!-- 导出笔记 -->
        <div class="export-section">
            <h3>导出笔记</h3>
            <button onclick="exportNotes()">导出笔记</button>
        </div>

    </div>

    <script src="settings.js"></script>

</body>
</html>
