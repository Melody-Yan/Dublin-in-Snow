<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="movies">

  <div class="container">
    <h1>影单</h1>
    <p class="quote">“电影是通往灵魂的窗户。”</p>

    <div class="music-player">
      <p id="music-title" class="music-title">无音乐</p>
      <audio id="audio"></audio>
      <div class="progress-container" id="music-bar"><div id="music-progress"></div></div>
      <div class="controls">
        <button data-music="prev" aria-label="上一首">⏮</button>
        <button data-music="toggle" aria-label="播放或暂停">▶</button>
        <button data-music="next" aria-label="下一首">⏭</button>
      </div>
    </div>

    <div class="category-container" id="categories"></div>
    <p id="categoryQuote" class="category-quote"></p>

    <div class="search-box">
      <input type="search" id="search" placeholder="搜索片名、导演、标签或短评" aria-label="搜索电影">
    </div>

    <div id="list" class="lib-list"></div>
    <div id="pager" class="pager"></div>

    <div class="buttons">
      <button type="button" class="pill" id="addBtn">添加电影</button>
      <a class="pill" href="index.html">返回首页</a>
    </div>

    <form id="form" class="entry-form hidden">
      <input type="text" id="f-title" aria-label="电影名">
      <input type="text" id="f-sub" aria-label="导演">
      <textarea id="f-review" aria-label="电影评论"></textarea>
      <input type="text" id="f-tags" placeholder="标签（用逗号分隔）" aria-label="标签">
      <div class="rating" id="f-rating" role="group" aria-label="评分">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
      </div>
      <div class="form-actions">
        <button type="submit" class="pill" id="f-submit">提交</button>
        <button type="button" class="pill" id="f-cancel">取消</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
  <script>
    initLibrary({
      key: 'movies',
      subKey: 'director',
      labels: ['电影名', '导演', '电影评论'],
      empty: '这个分类还空着，点下面的「添加电影」开始记录。',
      categories: [
        { id: 'watchlist', label: '想看', quote: '“还有许多待探索的故事，正等着我去发现。”' },
        { id: 'watching',  label: '在看', quote: '“正在这片荧幕里，寻觅着梦的碎片。”' },
        { id: 'watched',   label: '已看', quote: '“每一部电影都是一次心灵的旅行。”' },
        { id: 'dropped',   label: '弃看', quote: '“有些故事，未完待续。”' }
      ]
    });
  </script>
</body>
</html>
