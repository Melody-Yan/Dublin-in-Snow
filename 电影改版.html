<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影单</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: url('https://resource-17v.pages.dev/movies.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            margin-top: 12vh;
        }
        h1 {
            font-size: 38px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
        }
        .category-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .category-button {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 16px;
        }
        .category-button:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        .active {
            background: rgba(255, 255, 255, 0.7);
            color: black;
        }
        .category-quote {
            font-style: italic;
            color: #fff8dc; /* 柔和奶油白 */
            margin-bottom: 20px;
        }
        .search-box input {
            padding: 8px;
            width: 250px;
            border-radius: 5px;
            border: none;
        }
        .movie-list {
            max-width: 600px;
            margin: 20px auto;
            text-align: left;
        }
        .movie {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            color: #f0f0f0;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }
        .delete-button, .edit-button {
            float: right;
            background: rgba(255, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            color: white;
        }
        .delete-button:hover, .edit-button:hover {
            background: rgba(255, 0, 0, 1);
        }
        .rating {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        .star {
            cursor: pointer;
            color: gold;
            font-size: 18px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .buttons div {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 5);
        }
        .buttons div:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        #categoryQuote {
            text-align: center;
            margin-top: 10px;
            font-size: 18px;
            font-style: italic;
            color: #FFFFFF; /* 这里换成你喜欢的颜色 */
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 5); /* 增加一点阴影 */
        }
        .form-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group textarea,
        .form-group input {
            flex: 1; /* 让书评和标签输入框均分空间 */
            padding: 8px;
            border-radius: 5px;
            border: none;
        }

        .rating {
            display: flex;
            gap: 5px;
            cursor: pointer;
        }

        .star {
            font-size: 18px;
            color: gray;
        }

        .star:hover,
        .star.selected {
            color: gold;
        }
.pagination {
    margin-top: 20px;
    text-align: center;
}
.page-button {
    background: rgba(0, 0, 0, 0.6);
    padding: 8px 12px;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    margin: 0 5px;
    display: inline-block;
}
.page-button:hover, .active-page {
    background: rgba(255, 255, 255, 0.7);
    color: black;
}
/* 播放器样式 */
        .music-player {
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px 15px;
            width: 250px;
        }
        .music-player button {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin: 0 10px;
        }
        .music-player button:hover {
            color: rgba(255, 255, 255, 0.8);
        }

 .music-player {
            margin: 6px auto; /* 播放器与诗歌卡片的间距更小 */
            padding: 6px 10px; 
            width: 220px;
        }
        .music-player button {
            font-size: 16px;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>影单</h1>
        <p class="quote">“电影是通往灵魂的窗户。”</p>

        <div class="category-container">
            <div class="category-button" onclick="changeCategory('watchlist')">想看</div>
            <div class="category-button" onclick="changeCategory('watching')">在看</div>
            <div class="category-button" onclick="changeCategory('watched')">已看</div>
            <div class="category-button" onclick="changeCategory('dropped')">弃看</div>
        </div>

<!-- 播放器 -->
    <div class="music-player">
        <button onclick="prevSong()">⏮</button>
        <button onclick="togglePlay()">⏸</button>
        <button onclick="nextSong()">⏭</button>
        <audio id="audio-player"></audio>
    </div>

        <p id="categoryQuote" class="category-quote"></p>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索电影、导演或标签" oninput="searchMovies()">
        </div>

        <div id="movieList" class="movie-list"></div>
        <div id="pagination" class="pagination"></div>

        <div class="buttons">
            <div onclick="showAddMovieForm()">添加电影</div>
            <div onclick="location.href='index.html'">返回首页</div>
        </div>

       <div id="addMovieForm" style="display: none;">
        <input type="text" id="movieTitle" placeholder="电影名">
        <input type="text" id="movieDirector" placeholder="导演">
        
        <div class="form-group">
            <textarea id="movieReview" placeholder="电影评论"></textarea>
            <input type="text" id="movieTags" placeholder="标签 (用逗号分隔)">

            <!-- 评分部分 -->
            <div class="rating" id="ratingInput">
                <span class="star" onclick="setRating(1)">★</span>
                <span class="star" onclick="setRating(2)">★</span>
                <span class="star" onclick="setRating(3)">★</span>
                <span class="star" onclick="setRating(4)">★</span>
                <span class="star" onclick="setRating(5)">★</span>
            </div>
        </div>

        <!-- 只保留一个提交按钮 -->
        <div class="category-button" onclick="addMovie()">提交</div>
    </div>
    </div>

    <script>
     let currentCategory = 'watchlist';  // 默认分类为待看

function showAddMovieForm() {
    document.getElementById('addMovieForm').style.display = 'block';
}

function addMovie() {
    let title = document.getElementById('movieTitle').value;
    let director = document.getElementById('movieDirector').value;
    let review = document.getElementById('movieReview').value;
    let tags = document.getElementById('movieTags').value;
    let dateAdded = new Date().toLocaleDateString();
    let rating = getRating(); // 获取评分

    if (!title || !director) {
        alert('电影名称和导演不能为空！');
        return;
    }

    let movies = JSON.parse(localStorage.getItem('movies')) || [];
    movies.unshift({ id: Date.now(), title, director, review, tags, category: currentCategory, dateAdded, rating });
    localStorage.setItem('movies', JSON.stringify(movies));
    document.getElementById('addMovieForm').style.display = 'none';
    loadMovies();
}

function loadMovies() {
    let movies = JSON.parse(localStorage.getItem('movies')) || [];
    let movieList = document.getElementById('movieList');
    movieList.innerHTML = '';  // 清空当前电影列表

    movies.filter(movie => movie.category === currentCategory).forEach(movie => {
        let movieDiv = document.createElement('div');
        movieDiv.classList.add('movie');
        movieDiv.innerHTML = `
            <div><strong>《${movie.title}》</strong> - ${movie.director} 
                <span class="delete-button" onclick="deleteMovie(${movie.id})">删除</span>
                <span class="edit-button" onclick="editMovie(${movie.id})">编辑</span>
            </div>
            <div>评分: <span class="rating">${'★'.repeat(movie.rating)}${'☆'.repeat(5 - movie.rating)}</span></div>
        `;
        movieList.appendChild(movieDiv);
    });
}

function deleteMovie(movieId) {
    let movies = JSON.parse(localStorage.getItem('movies')) || [];
    movies = movies.filter(movie => movie.id !== movieId);
    localStorage.setItem('movies', JSON.stringify(movies));
    loadMovies();
}

function editMovie(movieId) {
    let movies = JSON.parse(localStorage.getItem('movies')) || [];
    let movie = movies.find(movie => movie.id === movieId);
    
    // 自动填充编辑表单
    document.getElementById('movieTitle').value = movie.title;
    document.getElementById('movieDirector').value = movie.director;
    document.getElementById('movieReview').value = movie.review;
    document.getElementById('movieTags').value = movie.tags;
    setRating(movie.rating);  // 填充评分
    currentCategory = movie.category;  // 保持原分类
    document.getElementById('addMovieForm').style.display = 'block';  // 显示编辑表单
}

function searchMovies() {
    let query = document.getElementById('searchInput').value.toLowerCase();
    let movies = JSON.parse(localStorage.getItem('movies')) || [];
    let movieList = document.getElementById('movieList');
    movieList.innerHTML = '';  // 清空当前电影列表

    movies.filter(movie => 
        movie.category === currentCategory && 
        (movie.title.toLowerCase().includes(query) || movie.director.toLowerCase().includes(query)
        )).forEach(movie => {
            let movieDiv = document.createElement('div');
            movieDiv.classList.add('movie');
            movieDiv.innerHTML = `
                <div><strong>《${movie.title}》</strong> - ${movie.director}
                    <span class="delete-button" onclick="deleteMovie(${movie.id})">删除</span>
                    <span class="edit-button" onclick="editMovie(${movie.id})">编辑</span>
                </div>
                <div>评分: <span class="rating">${'★'.repeat(movie.rating)}${'☆'.repeat(5 - movie.rating)}</span></div>
            `;
            movieList.appendChild(movieDiv);
        });
}

function changeCategory(category) {
    currentCategory = category;
    let categoryQuote = document.getElementById('categoryQuote');

    let quotes = {
        "watchlist": "“还有许多待探索的故事，正等着我去发现。”",
        "watching": "“正在这片荧幕里，寻觅着梦的碎片。”",
        "watched": "“每一部电影都是一次心灵的旅行。”",
        "dropped": "“有些故事，未完待续。”"
    };
    
    categoryQuote.textContent = quotes[category];
    loadMovies();  // 刷新电影列表
}

function setRating(rating) {
    let stars = document.querySelectorAll('.star');
    stars.forEach((star, index) => {
        star.classList.remove('selected');
        if (index < rating) {
            star.classList.add('selected');
        }
    });
}

function getRating() {
    let selectedStars = document.querySelectorAll('.star.selected').length;
    return selectedStars;
}
let currentPage = 1;
const itemsPerPage = 4;

function loadMovies(page = 1) {
    let movies = JSON.parse(localStorage.getItem('movies')) || [];
    let filteredMovies = movies.filter(movie => movie.category === currentCategory);
    
    let totalPages = Math.ceil(filteredMovies.length / itemsPerPage);
    currentPage = Math.max(1, Math.min(page, totalPages));

    let start = (currentPage - 1) * itemsPerPage;
    let end = start + itemsPerPage;
    let movieList = document.getElementById('movieList');
    movieList.innerHTML = '';

    filteredMovies.slice(start, end).forEach(movie => {
        let movieDiv = document.createElement('div');
        movieDiv.classList.add('movie');
        movieDiv.innerHTML = `
            <div><strong>《${movie.title}》</strong> - ${movie.director}
                <span class="delete-button" onclick="deleteMovie(${movie.id})">删除</span>
                <span class="edit-button" onclick="editMovie(${movie.id})">编辑</span>
            </div>
            <div>评分: <span class="rating">${'★'.repeat(movie.rating)}${'☆'.repeat(5 - movie.rating)}</span></div>
        `;
        movieList.appendChild(movieDiv);
    });

    renderPagination(totalPages);
}

function renderPagination(totalPages) {
    let pagination = document.getElementById('pagination');
    pagination.innerHTML = '';

    if (totalPages > 1) {
        if (currentPage > 1) {
            pagination.innerHTML += `<span class="page-button" onclick="loadMovies(${currentPage - 1})">« 上一页</span>`;
        }
        for (let i = 1; i <= totalPages; i++) {
            pagination.innerHTML += `<span class="page-button ${i === currentPage ? 'active-page' : ''}" onclick="loadMovies(${i})">${i}</span>`;
        }
        if (currentPage < totalPages) {
            pagination.innerHTML += `<span class="page-button" onclick="loadMovies(${currentPage + 1})">下一页 »</span>`;
        }
    }
}

 let audio = document.getElementById("audio-player");
        let songIndex = 0;

        // 从localStorage获取音乐链接
        let songs = JSON.parse(localStorage.getItem("musicLinks") || "[]");
        
        // 如果没有歌曲数据，给出提示
        if (songs.length === 0) {
            alert("没有找到音乐，请先添加歌曲链接。");
        }

        function playSong(index) {
            if (songs.length > 0) {
                audio.src = songs[index];
                audio.play();
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function prevSong() {
            if (songs.length > 0) {
                songIndex = (songIndex - 1 + songs.length) % songs.length;
                playSong(songIndex);
            }
        }

        function nextSong() {
            if (songs.length > 0) {
                songIndex = (songIndex + 1) % songs.length;
                playSong(songIndex);
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            // 在页面加载后加载并展示歌曲列表
            console.log("当前音乐列表：", songs);
            if (songs.length > 0) {
                playSong(songIndex);  // 默认播放第一首
            }
        });

    </script>
</body>
</html>
