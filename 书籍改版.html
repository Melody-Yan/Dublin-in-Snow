<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书架</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: url('https://resource-17v.pages.dev/books.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            margin-top: 12vh;
        }
        h1 {
            font-size: 38px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
        }
        .category-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .category-button {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 16px;
        }
        .category-button:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        .active {
            background: rgba(255, 255, 255, 0.7);
            color: black;
        }
        .category-quote {
            font-style: italic;
            color: #fff8dc; /* 柔和奶油白 */
            margin-bottom: 20px;
        }
        .search-box input {
            padding: 8px;
            width: 250px;
            border-radius: 5px;
            border: none;
        }
        .book-list {
            max-width: 600px;
            margin: 20px auto;
            text-align: left;
        }
        .book {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            color: #f0f0f0;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }
        .delete-button, .edit-button {
            float: right;
            background: rgba(255, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            color: white;
        }
        .delete-button:hover, .edit-button:hover {
            background: rgba(255, 0, 0, 1);
        }
        .rating {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        .star {
            cursor: pointer;
            color: gold;
            font-size: 18px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .buttons div {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 5);
        }
        .buttons div:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        #categoryQuote {
            text-align: center;
            margin-top: 10px;
            font-size: 18px;
            font-style: italic;
            color: #FFFFFF; /* 这里换成你喜欢的颜色 */
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 5); /* 增加一点阴影 */
        }
.form-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group textarea,
        .form-group input {
            flex: 1; /* 让书评和标签输入框均分空间 */
            padding: 8px;
            border-radius: 5px;
            border: none;
        }

        .rating {
            display: flex;
            gap: 5px;
            cursor: pointer;
        }

        .star {
            font-size: 18px;
            color: gray;
        }

        .star:hover,
        .star.selected {
            color: gold;
        }
  /* 播放器样式 */
        .music-player {
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px 15px;
            width: 250px;
        }
        .music-player button {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin: 0 10px;
        }
        .music-player button:hover {
            color: rgba(255, 255, 255, 0.8);
        }

 .music-player {
            margin: 6px auto; /* 播放器与诗歌卡片的间距更小 */
            padding: 6px 10px; 
            width: 220px;
        }
        .music-player button {
            font-size: 16px;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>书架</h1>
        <p class="quote">“阅读是旅行的一种方式。”</p>

        <div class="category-container">
            <div class="category-button" onclick="changeCategory('snow')">都柏林的雪（想读）</div>
            <div class="category-button" onclick="changeCategory('reading')">旅途中的灯（在读）</div>
            <div class="category-button" onclick="changeCategory('finished')">落幕的章节（已读）</div>
            <div class="category-button" onclick="changeCategory('abandoned')">遗忘的书页（弃读）</div>
        </div>

    <!-- 播放器 -->
    <div class="music-player">
        <button onclick="prevSong()">⏮</button>
        <button onclick="togglePlay()">⏸</button>
        <button onclick="nextSong()">⏭</button>
        <audio id="audio-player"></audio>
    </div>

</div>
        <p id="categoryQuote" class="category-quote"></p>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索书籍、作者或标签" oninput="searchBooks()">
        </div>

        <div id="bookList" class="book-list"></div>

        <div class="buttons">
            <div onclick="showAddBookForm()">添加书籍</div>
            <div onclick="location.href='index.html'">返回首页</div>
        </div>

       <div id="addBookForm" style="display: none;">
        <input type="text" id="bookTitle" placeholder="书名">
        <input type="text" id="bookAuthor" placeholder="作者">
        
        <div class="form-group">
            <textarea id="bookReview" placeholder="书评"></textarea>
            <input type="text" id="bookTags" placeholder="标签 (用逗号分隔)">
            
            <!-- 评分部分 -->
            <div class="rating" id="ratingInput">
                <span class="star" onclick="setRating(1)">★</span>
                <span class="star" onclick="setRating(2)">★</span>
                <span class="star" onclick="setRating(3)">★</span>
                <span class="star" onclick="setRating(4)">★</span>
                <span class="star" onclick="setRating(5)">★</span>
            </div>
        </div>

        <!-- 只保留一个提交按钮 -->
        <div class="category-button" onclick="addBook()">提交</div>
    </div>
    </div>

    <script>
        let currentCategory = 'snow';

        function showAddBookForm() {
            document.getElementById('addBookForm').style.display = 'block';
        }

        function addBook() {
            let title = document.getElementById('bookTitle').value;
            let author = document.getElementById('bookAuthor').value;
            let review = document.getElementById('bookReview').value;
            let tags = document.getElementById('bookTags').value;
            let dateAdded = new Date().toLocaleDateString();
            let rating = 0; // 默认评分为0

            if (!title || !author) {
                alert('书名和作者不能为空！');
                return;
            }

            let books = JSON.parse(localStorage.getItem('books')) || [];
            books.unshift({ id: Date.now(), title, author, review, tags, category: currentCategory, dateAdded, rating });
            localStorage.setItem('books', JSON.stringify(books));
            document.getElementById('addBookForm').style.display = 'none';
            loadBooks();
        }

       function loadBooks(page = 1) {
    let books = JSON.parse(localStorage.getItem('books')) || [];
    let bookList = document.getElementById('bookList');
    bookList.innerHTML = '';

    // 过滤当前分类的书籍
    let filteredBooks = books.filter(book => book.category === currentCategory);

    // 分页逻辑
    let booksPerPage = 4;
    let totalPages = Math.ceil(filteredBooks.length / booksPerPage);
    let startIndex = (page - 1) * booksPerPage;
    let endIndex = startIndex + booksPerPage;
    let paginatedBooks = filteredBooks.slice(startIndex, endIndex);

    paginatedBooks.forEach(book => {
        let bookDiv = document.createElement('div');
        bookDiv.classList.add('book');
        bookDiv.innerHTML = `
            <div><strong>《${book.title}》</strong> - ${book.author} 
                <span class="delete-button" onclick="deleteBook(${book.id})">删除</span>
                <span class="edit-button" onclick="editBook(${book.id})">编辑</span>
            </div>
            <div>评分: <span class="rating">${'★'.repeat(book.rating)}${'☆'.repeat(5 - book.rating)}</span></div>
        `;
        bookList.appendChild(bookDiv);
    });

    // 添加分页按钮
    let paginationDiv = document.createElement('div');
    paginationDiv.style.textAlign = 'center';
    paginationDiv.style.marginTop = '20px';

    for (let i = 1; i <= totalPages; i++) {
        let pageButton = document.createElement('button');
        pageButton.innerText = i;
        pageButton.style.margin = '5px';
        pageButton.style.padding = '8px 12px';
        pageButton.style.border = 'none';
        pageButton.style.cursor = 'pointer';
        pageButton.style.borderRadius = '5px';
        pageButton.style.background = i === page ? '#ffffff' : 'rgba(0, 0, 0, 0.5)';
        pageButton.style.color = i === page ? '#000' : '#fff';
        pageButton.onclick = () => loadBooks(i);
        paginationDiv.appendChild(pageButton);
    }

    bookList.appendChild(paginationDiv);
}

        function changeCategory(category) {
            currentCategory = category;
            let categoryQuote = document.getElementById('categoryQuote');

            let quotes = {
                "snow": "“在都柏林的雪中，总有未曾翻开的书页。”",  
                "reading": "“旅途的灯未熄，文字依然温暖。”",  
                "finished": "“落幕的章节，仍在心中吟诵。”",  
                "abandoned": "“这里的书已经被遗忘，或许有一天会再次拾起。”"  
            };

            categoryQuote.innerText = quotes[category];
            loadBooks();
        }

        function deleteBook(bookId) {
            let books = JSON.parse(localStorage.getItem('books')) || [];
            books = books.filter(book => book.id !== bookId);
            localStorage.setItem('books', JSON.stringify(books));
            loadBooks();
        }

        function editBook(bookId) {
            let books = JSON.parse(localStorage.getItem('books')) || [];
            let book = books.find(b => b.id === bookId);
            
            // 填充表单进行编辑
            document.getElementById('bookTitle').value = book.title;
            document.getElementById('bookAuthor').value = book.author;
            document.getElementById('bookReview').value = book
            document.getElementById('bookReview').value = book.review;
            document.getElementById('bookTags').value = book.tags;

            document.getElementById('addBookForm').style.display = 'block';

            // 隐藏添加书籍按钮
            document.querySelector('.buttons div').style.display = 'none';

            // 更新按钮为保存
            let saveButton = document.createElement('div');
            saveButton.textContent = '保存更改';
            saveButton.onclick = function () {
                saveEdit(bookId);
            };

            document.querySelector('.buttons').appendChild(saveButton);
        }

        function saveEdit(bookId) {
            let books = JSON.parse(localStorage.getItem('books')) || [];
            let bookIndex = books.findIndex(book => book.id === bookId);
            
            if (bookIndex === -1) return;

            let updatedBook = {
                id: bookId,
                title: document.getElementById('bookTitle').value,
                author: document.getElementById('bookAuthor').value,
                review: document.getElementById('bookReview').value,
                tags: document.getElementById('bookTags').value,
                category: currentCategory,
                dateAdded: books[bookIndex].dateAdded,
                rating: books[bookIndex].rating // 保持原评分
            };

            books[bookIndex] = updatedBook;
            localStorage.setItem('books', JSON.stringify(books));

            document.getElementById('addBookForm').style.display = 'none';
            loadBooks();

            // 恢复按钮
            document.querySelector('.buttons div').style.display = 'block';
            document.querySelector('.buttons').removeChild(saveButton);
        }

        function searchBooks() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let books = JSON.parse(localStorage.getItem('books')) || [];
            let bookList = document.getElementById('bookList');
            bookList.innerHTML = '';

            books.filter(book => {
                return (
                    book.title.toLowerCase().includes(query) ||
                    book.author.toLowerCase().includes(query) ||
                    book.tags.toLowerCase().includes(query)
                );
            }).forEach(book => {
                let bookDiv = document.createElement('div');
                bookDiv.classList.add('book');
                bookDiv.innerHTML = `
                    <div><strong>《${book.title}》</strong> - ${book.author} 
                        <span class="delete-button" onclick="deleteBook(${book.id})">删除</span>
                        <span class="edit-button" onclick="editBook(${book.id})">编辑</span>
                    </div>
                    <div>评分: <span class="rating">${'★'.repeat(book.rating)}${'☆'.repeat(5 - book.rating)}</span></div>
                `;
                bookList.appendChild(bookDiv);
            });
        }

        // 初始化加载
        loadBooks();
     let rating = 0; // 初始化评分

        function setRating(stars) {
            rating = stars;
            const starsElements = document.querySelectorAll("#ratingInput .star");
            
            // 更新星级显示
            starsElements.forEach((star, index) => {
                if (index < stars) {
                    star.style.color = "gold";  // 填充金色
                } else {
                    star.style.color = "gray";  // 未选中的星星为灰色
                }
            });
        }

        function addBook() {
            let title = document.getElementById('bookTitle').value;
            let author = document.getElementById('bookAuthor').value;
            let review = document.getElementById('bookReview').value;
            let tags = document.getElementById('bookTags').value;
            let dateAdded = new Date().toLocaleDateString();

            if (!title || !author) {
                alert('书名和作者不能为空！');
                return;
            }

            let books = JSON.parse(localStorage.getItem('books')) || [];
            books.unshift({ id: Date.now(), title, author, review, tags, category: currentCategory, dateAdded, rating: rating });
            localStorage.setItem('books', JSON.stringify(books));
            document.getElementById('addBookForm').style.display = 'none';
            loadBooks();
        }

 let audio = document.getElementById("audio-player");
        let songIndex = 0;

        // 从localStorage获取音乐链接
        let songs = JSON.parse(localStorage.getItem("musicLinks") || "[]");
        
        // 如果没有歌曲数据，给出提示
        if (songs.length === 0) {
            alert("没有找到音乐，请先添加歌曲链接。");
        }

        function playSong(index) {
            if (songs.length > 0) {
                audio.src = songs[index];
                audio.play();
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function prevSong() {
            if (songs.length > 0) {
                songIndex = (songIndex - 1 + songs.length) % songs.length;
                playSong(songIndex);
            }
        }

        function nextSong() {
            if (songs.length > 0) {
                songIndex = (songIndex + 1) % songs.length;
                playSong(songIndex);
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            // 在页面加载后加载并展示歌曲列表
            console.log("当前音乐列表：", songs);
            if (songs.length > 0) {
                playSong(songIndex);  // 默认播放第一首
            }
        });


    </script>
</body>
</html>
