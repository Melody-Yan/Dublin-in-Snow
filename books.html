<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>书架</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="books">

  <div class="container">
    <h1>书架</h1>
    <p class="quote">“阅读是旅行的一种方式。”</p>

    <div class="music-player">
      <p id="music-title" class="music-title">无音乐</p>
      <audio id="audio"></audio>
      <div class="progress-container" id="music-bar"><div id="music-progress"></div></div>
      <div class="controls">
        <button data-music="prev" aria-label="上一首">⏮</button>
        <button data-music="toggle" aria-label="播放或暂停">▶</button>
        <button data-music="next" aria-label="下一首">⏭</button>
      </div>
    </div>

    <div class="category-container" id="categories"></div>
    <p id="categoryQuote" class="category-quote"></p>

    <div class="search-box">
      <input type="search" id="search" placeholder="搜索书名、作者、标签或书评" aria-label="搜索书籍">
    </div>

    <div id="list" class="lib-list"></div>
    <div id="pager" class="pager"></div>

    <div class="buttons">
      <button type="button" class="pill" id="addBtn">添加书籍</button>
      <a class="pill" href="index.html">返回首页</a>
    </div>

    <form id="form" class="entry-form hidden">
      <input type="text" id="f-title" aria-label="书名">
      <input type="text" id="f-sub" aria-label="作者">
      <textarea id="f-review" aria-label="书评"></textarea>
      <input type="text" id="f-tags" placeholder="标签（用逗号分隔）" aria-label="标签">
      <div class="rating" id="f-rating" role="group" aria-label="评分">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
      </div>
      <div class="form-actions">
        <button type="submit" class="pill" id="f-submit">提交</button>
        <button type="button" class="pill" id="f-cancel">取消</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
  <script>
    initLibrary({
      key: 'books',
      subKey: 'author',
      labels: ['书名', '作者', '书评'],
      empty: '这个分类还空着，点下面的「添加书籍」开始记录。',
      categories: [
        { id: 'snow',      label: '都柏林的雪（想读）', quote: '“在都柏林的雪中，总有未曾翻开的书页。”' },
        { id: 'reading',   label: '旅途中的灯（在读）', quote: '“旅途的灯未熄，文字依然温暖。”' },
        { id: 'finished',  label: '落幕的章节（已读）', quote: '“落幕的章节，仍在心中吟诵。”' },
        { id: 'abandoned', label: '遗忘的书页（弃读）', quote: '“这里的书已经被遗忘，或许有一天会再次拾起。”' }
      ]
    });
  </script>
</body>
</html>
